<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pointage Terminal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <div class="card">
      <h1>POINTAGE</h1>
      <p>Cliquez sur un bouton pour démarrer ou arrêter le temps.</p>

      <section class="bloc">
        <h2>Travail</h2>
        <button id="workBtn" class="btn">Travail</button>
        <p id="workTime">0h00</p>
      </section>

      <section class="bloc">
        <h2>Déjeuner</h2>
        <button id="lunchBtn" class="btn">Déjeuner</button>
        <p id="lunchTime">0h00</p>
      </section>

      <section>
        <h2>Résumé semaine</h2>
        <select id="weekSummary"></select>
        <div class="actions">
          <button id="clearAll" class="btn small danger">Effacer tout</button>
        </div>
      </section>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
