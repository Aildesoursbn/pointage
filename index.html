<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pointage Terminal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <div class="card">
      <h1>POINTAGE</h1>
      <p>Cliquez sur un bouton pour démarrer ou arrêter le chronomètre.</p>

      <section class="bloc">
        <button id="workBtn" class="btn">Travail</button>
        <p id="workTimer" class="status">00:00:00</p>
      </section>

      <section class="bloc">
        <button id="lunchBtn" class="btn">Déjeuner</button>
        <p id="lunchTimer" class="status">00:00:00</p>
      </section>

      <section>
        <h2>Résumé</h2>
        <p>Travail net : <span id="dailyTotal">0h00</span></p>
        <h3>Semaine</h3>
        <select id="weekDropdown"></select>
        <div class="actions">
          <button id="exportCsv" class="btn small">Exporter CSV</button>
          <button id="clearAll" class="btn small danger">Effacer tout</button>
        </div>
      </section>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
